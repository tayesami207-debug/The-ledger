<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>The Ledger — activation</title>
    <!--
      The activation screen for a copy of The Ledger that was sent to someone else.

      It is a plain page on purpose: it has to run before the app is unlocked, so
      it cannot depend on the app's own bundle. Vite copies `public/` into `dist/`,
      the desktop server serves it from the same origin as the API, and
      electron/main.cjs opens this URL instead of the app while the copy is
      unlicensed. `POST /api/license/activate` verifies the key with the public key
      the app was built with (see shared/license.js) and stores it in this app's
      data folder; the page then reloads into the app.
    -->
    <style>
      :root {
        --bg: #101b14;
        --panel: #16241b;
        --border: #26382c;
        --text: #e8ede7;
        --muted: #93a395;
        --gold: #d4af37;
        --danger: #e2725b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 560px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 30px 32px 28px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 3px;
        letter-spacing: 0.01em;
      }
      .sub {
        font-size: 12.5px;
        color: var(--muted);
      }
      .lede {
        font-size: 14px;
        line-height: 1.55;
        margin: 0 0 22px;
        color: var(--text);
      }
      .lede.warn {
        color: var(--danger);
      }
      label {
        display: block;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin-bottom: 7px;
      }
      textarea {
        width: 100%;
        min-height: 86px;
        resize: vertical;
        background: #0d1610;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 11px 12px;
        font-family: ui-monospace, Consolas, "Courier New", monospace;
        font-size: 12.5px;
        line-height: 1.5;
        word-break: break-all;
      }
      textarea:focus {
        outline: none;
        border-color: var(--gold);
      }
      button {
        font: inherit;
        font-size: 13.5px;
        padding: 10px 18px;
        border-radius: 9px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      button.primary {
        background: var(--gold);
        color: #101b14;
        font-weight: 600;
      }
      button.primary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        border-color: var(--border);
      }
      button.ghost:hover {
        color: var(--text);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
      }
      .machine {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #0d1610;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 11px 13px;
        margin-bottom: 22px;
      }
      .machine .code {
        font-family: ui-monospace, Consolas, "Courier New", monospace;
        font-size: 15px;
        letter-spacing: 0.08em;
        color: var(--gold);
      }
      .machine .hint {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 5px;
      }
      .message {
        margin-top: 16px;
        font-size: 13px;
        line-height: 1.5;
        display: none;
      }
      .message.show {
        display: block;
      }
      .message.error {
        color: var(--danger);
      }
      .message.ok {
        color: #8fd694;
      }
      footer {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 11.5px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      code {
        font-family: ui-monospace, Consolas, "Courier New", monospace;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <rect x="1" y="1" width="32" height="32" rx="7" fill="#12241a" stroke="#d4af37" stroke-width="1.2" />
          <rect x="8" y="6" width="18" height="2" rx="1" fill="#d4af37" />
          <rect x="10" y="19" width="3" height="8" rx="1" fill="#8fd694" />
          <rect x="15.5" y="14" width="3" height="13" rx="1" fill="#8fd694" />
          <rect x="21" y="9.5" width="3" height="17.5" rx="1" fill="#d4af37" />
        </svg>
        <div>
          <h1>The Ledger</h1>
          <div class="sub">Activation</div>
        </div>
      </header>

      <p id="lede" class="lede">Checking this copy…</p>

      <div class="machine">
        <div>
          <label style="margin: 0">Installation ID for this PC</label>
          <div id="machine-id" class="code">—</div>
          <div class="hint">Send this ID if you were asked for it.</div>
        </div>
        <button id="copy-id" class="ghost" type="button">Copy</button>
      </div>

      <label for="key">License key</label>
      <textarea id="key" spellcheck="false" placeholder="TL1.…"></textarea>

      <div class="row">
        <button id="activate" class="primary" type="button">Activate</button>
        <span id="busy" class="sub" style="display: none">Checking the key…</span>
      </div>

      <div id="message" class="message"></div>

      <footer>
        <span>Licensed copies only — this copy is not activated yet.</span>
        <span id="fingerprint"></span>
      </footer>
    </main>

    <script>
      const el = (id) => document.getElementById(id);
      const message = el('message');

      function showMessage(text, kind) {
        message.textContent = text;
        message.className = `message show ${kind || ''}`;
      }

      async function api(path, options) {
        const response = await fetch(path, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        });
        let payload = null;
        try {
          payload = await response.json();
        } catch (e) {
          payload = null;
        }
        return { response, payload };
      }

      function paint(status) {
        el('machine-id').textContent = status.machineId || 'unavailable';
        if (status.publicKeyFingerprint) {
          el('fingerprint').textContent = `key ${status.publicKeyFingerprint}`;
        }
        if (status.licensed) {
          const license = status.license || {};
          el('lede').className = 'lede';
          el('lede').textContent = license.to
            ? `Licensed to ${license.to}. Opening The Ledger…`
            : 'Licensed. Opening The Ledger…';
          return true;
        }
        el('lede').className = 'lede warn';
        el('lede').textContent = lockMessage(status);
        return false;
      }

      function lockMessage(status) {
        const license = status.license || {};
        switch (status.reason) {
          case 'missing':
            return 'This copy of The Ledger is locked. Paste the license key you were given below to unlock it.';
          case 'expired':
            return `This copy's license expired on ${license.exp}. Send the Installation ID below to renew it.`;
          case 'machine-mismatch':
            return 'The saved key was issued for a different PC, so it no longer works here. Send the Installation ID below to get a key for this machine.';
          case 'bad-signature':
            return 'The saved key is not valid for The Ledger. Paste a replacement key below.';
          case 'malformed':
            return 'The saved key could not be read. Paste a replacement key below.';
          default:
            return 'This copy of The Ledger is not activated.';
        }
      }

      async function refresh() {
        const { payload } = await api('/api/license/status');
        if (!payload) {
          el('lede').className = 'lede warn';
          el('lede').textContent = 'The Ledger could not check its license. Restart the app and try again.';
          return;
        }
        if (paint(payload)) {
          window.location.replace('/');
        }
      }

      el('copy-id').addEventListener('click', async () => {
        const id = el('machine-id').textContent.trim();
        if (!id || id === '—') return;
        try {
          await navigator.clipboard.writeText(id);
          el('copy-id').textContent = 'Copied';
        } catch (e) {
          el('copy-id').textContent = 'Select it';
        }
        setTimeout(() => {
          el('copy-id').textContent = 'Copy';
        }, 1600);
      });

      el('activate').addEventListener('click', async () => {
        const key = el('key').value.trim();
        if (!key) {
          showMessage('Paste the license key first.', 'error');
          return;
        }
        el('activate').disabled = true;
        el('busy').style.display = 'inline';
        try {
          const { payload } = await api('/api/license/activate', {
            method: 'POST',
            body: JSON.stringify({ key }),
          });
          if (payload && payload.ok && payload.licensed) {
            showMessage('Key accepted — opening The Ledger…', 'ok');
            setTimeout(() => window.location.replace('/'), 600);
            return;
          }
          showMessage((payload && payload.error) || 'That key was not accepted.', 'error');
        } catch (e) {
          showMessage('The Ledger could not reach its own service. Restart the app and try again.', 'error');
        } finally {
          el('activate').disabled = false;
          el('busy').style.display = 'none';
        }
      });

      el('key').addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) el('activate').click();
      });

      refresh();
    </script>
  </body>
</html>
